<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TimeAtlas</title>

    <!-- Structured data: site-wide WebSite + Organization schemas.
         These are static and identical on every page, so they live here rather
         than in a React component. stripBaseSeo() in prerender.mjs only removes
         title/og tags, so these script blocks survive into every prerendered page. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "TimeAtlas",
        "url": "https://timeatlas.co",
        "description": "Free time zone converter for meetings, travel, and remote work.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://timeatlas.co/convert?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "TimeAtlas",
        "url": "https://timeatlas.co",
        "logo": "https://timeatlas.co/conservatory-logo.webp"
      }
    </script>

    <!-- Base Meta Description -->
    <meta name="description" content="TimeAtlas – A time observatory for the internet" />

    <!-- Open Graph (Sharing) -->
    <meta property="og:title" content="TimeAtlas – A time observatory for the internet" />
    <meta
      property="og:description"
      content="Convert time, plan meetings, and explore world clocks with precision."
    />
    <meta property="og:image" content="https://timeatlas.co/og-image.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:url" content="https://timeatlas.co" />
    <meta property="og:type" content="website" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Google Analytics — lazy-injected after user interaction or 3500ms post-load.

      Strategy: initialise window.dataLayer and gtag() immediately so any
      early gtag() calls from React components are queued. The actual gtag.js
      network request is deferred until the first user interaction (scroll,
      mousemove, touchstart, keydown) OR 3500ms after window.onload —
      whichever comes first. This keeps gtag/js entirely out of the TBT
      window, eliminating the forced-reflow penalty it causes during parse.
    -->
    <script>
      // Queue stub — safe to call before gtag.js loads.
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-B310VMS98Q');

      // Lazy injection: inject gtag.js only after interaction or 3500ms timeout.
      (function () {
        var loaded = false;
        function loadGtag() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-B310VMS98Q';
          s.async = true;
          document.head.appendChild(s);
        }
        var events = ['scroll', 'mousemove', 'touchstart', 'keydown', 'click'];
        function onInteraction() {
          loadGtag();
          events.forEach(function (e) {
            document.removeEventListener(e, onInteraction);
          });
        }
        if (document.readyState === 'complete') {
          events.forEach(function (e) {
            document.addEventListener(e, onInteraction, { passive: true });
          });
          setTimeout(loadGtag, 3500);
        } else {
          window.addEventListener('load', function () {
            events.forEach(function (e) {
              document.addEventListener(e, onInteraction, { passive: true });
            });
            setTimeout(loadGtag, 3500);
          });
        }
      })();
    </script>
  </body>
</html>
