name: Deploy to Hostinger

# Push to main: build + verify only (a green run means the build is deployable).
# Actual FTP upload happens ONLY when triggered manually from the Actions tab
# (Run workflow button) — this preserves the visual-check-before-going-live
# workflow while making one-click deploys possible.
#
# History note: every automated deploy from runs #1–#21 failed in ~5s because
# the FTP step referenced SamKirkland/FTP-Deploy-Action@v4.3 — a tag that does
# not exist — and used v3-era input names (ftp-server etc.). The step below is
# pinned to a real tag and uses the v4 input names.

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_COLOR: 1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          FORCE_COLOR: 1

      - name: Verify build output
        run: |
          echo "=== Build Artifacts ==="
          ls -la dist/
          echo "--- file count in dist/ ---"
          find dist/ -type f | wc -l

          echo "--- critical files ---"
          for f in index.html 404.html convert.html world.html meet.html dev.html news.html \
                   journal.html about.html privacy.html terms.html est-to-pst.html \
                   journal/handling-dst-conversions.html journal/b2b-scheduling-blueprint.html \
                   sitemap.xml robots.txt llms.txt .htaccess; do
            if [ ! -f "dist/$f" ]; then
              echo "MISSING: dist/$f"
              exit 1
            fi
          done

          echo "--- prerender sanity ---"
          grep -q 'data-prerendered="true"' dist/index.html || { echo "index.html not prerendered"; exit 1; }
          grep -q 'noindex' dist/404.html || { echo "404.html missing noindex"; exit 1; }
          ! grep -q 'noindex' dist/privacy.html || { echo "privacy.html is noindexed"; exit 1; }
          echo "--- sitemap sanity ---"
          loc_count=$(grep -c '<loc>' dist/sitemap.xml)
          echo "sitemap URLs: $loc_count"
          [ "$loc_count" -ge 470 ] || { echo "sitemap has too few URLs ($loc_count < 470)"; exit 1; }

      # Runs only on manual "Run workflow" dispatch — never on push.
      # Requires repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
      # Create a dedicated FTP account in Hostinger hPanel (Files → FTP
      # Accounts) whose directory is public_html, so server-dir can stay ./
      - name: Deploy to Hostinger via FTP
        if: github.event_name == 'workflow_dispatch'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/
          server-dir: ./
          log-level: standard
