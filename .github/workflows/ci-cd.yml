name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Full history for commits analysis

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      # SEO guardrails — fail the build if critical prerendered output is
      # missing or carries wrong robots directives. The owner deploys by
      # uploading dist/ manually; a green run here means dist/ is safe to ship.
      - name: Verify build output
        run: |
          echo "--- critical files ---"
          for f in index.html 404.html convert.html world.html meet.html dev.html news.html \
                   journal.html about.html contact.html privacy.html terms.html est-to-pst.html \
                   journal/handling-dst-conversions.html journal/b2b-scheduling-blueprint.html \
                   sitemap.xml robots.txt llms.txt .htaccess; do
            if [ ! -f "dist/$f" ]; then
              echo "MISSING: dist/$f"
              exit 1
            fi
          done

          echo "--- prerender sanity ---"
          grep -q 'data-prerendered="true"' dist/index.html || { echo "index.html not prerendered"; exit 1; }
          grep -q 'noindex' dist/404.html || { echo "404.html missing noindex"; exit 1; }
          ! grep -q 'noindex' dist/privacy.html || { echo "privacy.html is noindexed"; exit 1; }

          echo "--- sitemap sanity ---"
          loc_count=$(grep -c '<loc>' dist/sitemap.xml)
          echo "sitemap URLs: $loc_count"
          [ "$loc_count" -ge 470 ] || { echo "sitemap has too few URLs ($loc_count < 470)"; exit 1; }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist-${{ github.run_id }}-${{ matrix.node-version }}
          path: dist/
          retention-days: 5
